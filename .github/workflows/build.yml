name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      # Needed only by the logo bootstrap step below, which commits the fetched
      # assets back so this never has to run again.
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Thirty team marks that change roughly never. Downloading them at runtime
      # cost a visibly empty widget on first launch, so they ship in the APK
      # instead. This fetches whatever is missing and commits it; on every later
      # run the files already exist and the whole step is a no-op.
      - name: Bootstrap team logo assets
        run: |
          set -euo pipefail
          DIR=app/src/main/assets/team-logos
          mkdir -p "$DIR"

          # Ask MLB for the current club list rather than hardcoding ids, so an
          # expansion or relocation is picked up without a code change.
          IDS=$(curl -fsS "https://statsapi.mlb.com/api/v1/teams?sportId=1" \
                | python3 -c 'import json,sys; print(" ".join(str(t["id"]) for t in json.load(sys.stdin)["teams"]))')

          ADDED=0
          for ID in $IDS; do
            [ -s "$DIR/$ID.png" ] && continue
            if curl -fsS -o "$DIR/$ID.png" \
                 "https://midfield.mlbstatic.com/v1/team/$ID/spots/96"; then
              ADDED=$((ADDED+1))
            else
              # Never leave a truncated file behind; the app falls back to the
              # network for any id it cannot find in assets.
              rm -f "$DIR/$ID.png"
              echo "::warning::Could not fetch logo for team $ID"
            fi
          done
          echo "Fetched $ADDED new logo(s); $(ls -1 "$DIR" | wc -l) total"

          if [ -n "$(git status --porcelain "$DIR")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$DIR"
            # [skip ci] so committing assets does not trigger another build.
            git commit -m "Add bundled MLB team logo assets [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || \
              echo "::warning::Could not push logo assets; they are still in this build"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gradle buries Kotlin's `e:` lines under its own stack traces, so on failure
      # re-print just the diagnostics as the last thing the step emits. Keeps the
      # signal at the tail of the log where it is cheap to read.
      - name: Compile and test
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest assembleDebug 2>&1 | tee build.log; then
            echo "::group::Kotlin diagnostics"
            echo "===== COMPILE ERRORS ====="
            grep -E '^(e|w): ' build.log | head -80 || echo "(no e:/w: lines found)"
            echo "===== FAILING TESTS ====="
            grep -E '^[A-Za-z0-9_.]+ > .* (FAILED|SKIPPED)$' build.log | head -40 || true
            grep -E '^\* What went wrong:' -A 6 build.log | head -30 || true
            echo "===== END ====="
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sports-widget-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build.log
          if-no-files-found: ignore

  api-contract:
    name: Verify StatsAPI field names
    runs-on: ubuntu-latest
    # Runs after the build so the two jobs do not race for the same Gradle cache
    # keys, and so a broken compile fails once rather than twice.
    needs: build
    # Checks our assumptions against the live MLB server. Informational: MLB being
    # down, or the season being over, must not turn the build red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run live contract tests
        env:
          RUN_LIVE_API_TESTS: '1'
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest --tests '*LiveStatsApiContractTest' 2>&1 | tee contract.log; then
            echo "::group::Contract failures"
            echo "===== FIELD MISMATCHES ====="
            grep -E '^(e|w): |FAILED|AssertionError|java.lang|expected:|but was:' contract.log | head -60 || true
            echo "===== END ====="
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload contract test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-report
          path: |
            app/build/reports/tests/
            contract.log
          if-no-files-found: ignore
