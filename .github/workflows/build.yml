name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # The point of the whole workflow: a file you can install on a phone
      # without a development machine.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sports-widget-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  api-contract:
    name: Verify StatsAPI field names
    runs-on: ubuntu-latest
    # Checks our assumptions against the live MLB server. Informational: MLB being
    # down, or the season being over, must not turn the build red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run live contract tests
        env:
          RUN_LIVE_API_TESTS: '1'
        run: ./gradlew testDebugUnitTest --tests '*LiveStatsApiContractTest' --stacktrace

      - name: Upload contract test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
